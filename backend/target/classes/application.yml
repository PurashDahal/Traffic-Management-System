server:
  port: 8080

spring:
  application:
    name: traffic-violation-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/trafficdb;DB_CLOSE_DELAY=-1}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  upload:
    dir: ${UPLOAD_DIR:uploads}
  ai:
    api-key: ${AI_API_KEY:demo-ai-key-antigravity}
    model: ${AI_MODEL:gemini-1.5-flash}
    url: ${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent}

logging:
  level:
    root: INFO
    com.traffic.system: DEBUG
